<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KOPHER 肌タイプ診断テスト</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Noto Sans JP', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif;
            background: #ffffff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: #ffffff;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(123, 44, 64, 0.1);
            max-width: 500px;
            width: 100%;
            padding: 40px;
            border: 1px solid #f5f5f5;
            animation: slideUp 0.5s ease;
            position: relative;
        }

        .logo-main {
            width: 100px;
            height: 100px;
            object-fit: contain;
            margin-bottom: 30px;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        h1 {
            text-align: center;
            color: #7b2c40;
            margin-bottom: 10px;
            font-size: 28px;
            font-weight: 700;
        }

        .subtitle {
            text-align: center;
            color: #999;
            margin-bottom: 30px;
            font-size: 14px;
        }

        .progress-bar {
            height: 6px;
            background: #f8f8f8;
            border-radius: 10px;
            margin-bottom: 30px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: #7b2c40;
            border-radius: 10px;
            transition: width 0.5s ease;
            width: 0%;
        }

        .question-container {
            animation: fadeIn 0.5s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateX(20px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        .question-number {
            display: inline-block;
            background: #7b2c40;
            color: white;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 12px;
            margin-bottom: 15px;
            font-weight: 600;
        }

        .question {
            font-size: 20px;
            color: #333;
            margin-bottom: 30px;
            line-height: 1.6;
            font-weight: 500;
        }

        .btn-group {
            display: flex;
            gap: 15px;
            justify-content: center;
        }

        .btn-back {
            display: flex;
            justify-content: center;
            margin-top: 20px;
        }

        .back-btn {
            background: transparent;
            color: #999;
            border: none;
            padding: 10px 20px;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: underline;
        }

        .back-btn:hover {
            color: #7b2c40;
        }

        .btn {
            flex: 1;
            padding: 15px 30px;
            border: 2px solid transparent;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            letter-spacing: 1px;
        }

        .btn-yes {
            background: #7b2c40;
            color: white;
            box-shadow: 0 4px 15px rgba(123, 44, 64, 0.2);
        }

        .btn-yes:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(123, 44, 64, 0.3);
            background: #692638;
        }

        .btn-no {
            background: white;
            color: #7b2c40;
            border: 2px solid #7b2c40;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
        }

        .btn-no:hover {
            background: #faf5f6;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.1);
        }

        .result-container {
            text-align: center;
            animation: zoomIn 0.5s ease;
        }

        @keyframes zoomIn {
            from {
                opacity: 0;
                transform: scale(0.9);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        .result-logo {
            width: 80px;
            height: 80px;
            object-fit: contain;
            margin-bottom: 20px;
        }

        .result-title {
            font-size: 24px;
            color: #333;
            margin-bottom: 15px;
            font-weight: 600;
        }

        .result-type {
            display: inline-block;
            background: #7b2c40;
            color: white;
            padding: 10px 25px;
            border-radius: 30px;
            font-size: 20px;
            margin-bottom: 20px;
            font-weight: 700;
            box-shadow: 0 4px 15px rgba(123, 44, 64, 0.2);
        }

        .result-description {
            color: #666;
            line-height: 1.8;
            margin-bottom: 20px;
            font-size: 16px;
        }

        .recommend-section {
            background: #faf5f6;
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 25px;
        }

        .recommend-title {
            font-size: 18px;
            color: #7b2c40;
            font-weight: 600;
            margin-bottom: 15px;
            text-align: center;
        }

        .product-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .product-item {
            background: white;
            padding: 12px 15px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            text-decoration: none;
            color: #333;
            transition: all 0.3s ease;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }

        .product-item:hover {
            transform: translateX(5px);
            box-shadow: 0 4px 10px rgba(123, 44, 64, 0.15);
            background: #fff9fa;
        }

        .product-name {
            font-size: 14px;
            font-weight: 500;
        }

        .product-arrow {
            color: #7b2c40;
            font-size: 18px;
        }

        .restart-btn {
            padding: 15px 40px;
            background: #7b2c40;
            color: white;
            border: none;
            border-radius: 30px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(123, 44, 64, 0.2);
        }

        .restart-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(123, 44, 64, 0.3);
            background: #692638;
        }

        #startScreen {
            text-align: center;
            animation: fadeIn 0.5s ease;
            padding-top: 20px;
        }

        .start-emoji {
            font-size: 100px;
            margin-bottom: 30px;
        }

        .start-description {
            color: #666;
            line-height: 1.8;
            margin-bottom: 30px;
            font-size: 16px;
        }

        .start-btn {
            padding: 15px 50px;
            background: #7b2c40;
            color: white;
            border: none;
            border-radius: 30px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(123, 44, 64, 0.2);
        }

        .start-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(123, 44, 64, 0.3);
            background: #692638;
        }

        /* 반응형 조정 */
        @media (max-width: 480px) {
            .logo-main {
                width: 80px;
                height: 80px;
            }
            
            .result-logo {
                width: 60px;
                height: 60px;
            }
            
            .container {
                padding: 30px 20px;
            }
            
            h1 {
                font-size: 24px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>肌タイプ診断テスト</h1>
        <p class="subtitle">あなたの肌タイプをチェック</p>
        
        <div class="progress-bar">
            <div class="progress-fill" id="progressBar"></div>
        </div>

        <div id="startScreen">
            <a href="https://www.qoo10.jp/shop/kopher" target="_blank">
                <img src="https://dp.image-qoo10.jp/dp2016/JP/GMKT.IMG/front_image/minishop/2024/03/19/e3f368a7-3fa0-43ba-b542-a3f1ae8b686c.s_110-w-fs-st_s.jpg" alt="KOPHER Logo" class="logo-main">
            </a>
            <p class="start-description">
                簡単な質問に答えるだけで<br>
                あなたの肌のタイプを診断しましょう。
            </p>
            <button class="start-btn" onclick="startDiagnosis()">診断スタート</button>
        </div>

        <div id="questionArea" style="display: none;"></div>
        <div id="resultArea" style="display: none;"></div>
    </div>

    <script>
        const questions = {
            Q1: {
                text: "洗顔後、肌がつっぱる",
                yes: "Q2",
                no: "Q5"
            },
            Q2: {
                text: "目元・口元の乾燥が気になる",
                yes: "Q3",
                no: "Q4"
            },
            Q3: {
                text: "保湿しても時間が経つと乾燥する",
                yes: "Q4",
                no: "Q4"
            },
            Q4: {
                text: "冬は化粧のノリが悪い",
                yes: "dry",
                no: "Q9"
            },
            Q5: {
                text: "ニキビ・吹き出物がよくできる",
                yes: "Q6",
                no: "Q8"
            },
            Q6: {
                text: "毛穴の広がりが目立つ",
                yes: "Q7",
                no: "Q9"
            },
            Q7: {
                text: "肌にべたつきやギトギト感がある",
                yes: "oily",
                no: "trouble"
            },
            Q8: {
                text: "季節の変わり目に肌の調子が悪くなる",
                yes: "Q9",
                no: "Q4"
            },
            Q9: {
                text: "刺激に弱く赤みやかゆみが出やすい",
                yes: "sensitive",
                no: "Q7"
            }
        };

        const results = {
            dry: {
                emoji: "💧",
                type: "乾燥肌",
                description: "",
                products: [
                    { name: "キュリペア  ダーマアンプル", url: "https://www.qoo10.jp/g/917815058" },
                    { name: "キュリペア ソリューション", url: "https://www.qoo10.jp/g/1048654649" },
                    { name: "キュリペア メラクリーム", url: "https://www.qoo10.jp/g/917815387" },
                    { name: "キュリペア メルダーSOSシステム", url: "https://www.qoo10.jp/g/979244228" },
                    { name: "キュリペア サンドラッピング", url: "https://www.qoo10.jp/g/1127360604" },
                    { name: "キュリペア シグネチャーアンプル", url: "https://www.qoo10.jp/g/1023479127" }
                ]
            },
            oily: {
                emoji: "✨",
                type: "脂性肌",
                description: "",
                products: [
                    { name: "クレイプライムパックトゥフォーム", url: "https://www.qoo10.jp/g/998398572" },
                    { name: "キュリペア  ダーマアンプル", url: "https://www.qoo10.jp/g/917815058" },
                    { name: "キュリペア メラクリーム", url: "https://www.qoo10.jp/g/917815387" },
                    { name: "キュリペア サンドラッピング", url: "https://www.qoo10.jp/g/1127360604" }
                ]
            },
            trouble: {
                emoji: "🌿",
                type: "トラブル肌",
                description: "",
                products: [
                    { name: "キュリペア  ダーマアンプル", url: "https://www.qoo10.jp/g/917815058" },
                    { name: "キュリペア メラクリーム", url: "https://www.qoo10.jp/g/917815387" },
                    { name: "キュリペア メルダーSOSシステム", url: "https://www.qoo10.jp/g/979244228" },
                    { name: "キュリペア サンドラッピング", url: "https://www.qoo10.jp/g/1127360604" }
                ]
            },
            sensitive: {
                emoji: "🌸",
                type: "敏感肌",
                description: "",
                products: [
                    { name: "クレイプライムパックトゥフォーム", url: "https://www.qoo10.jp/g/998398572" },
                    { name: "キュリペア ソリューション", url: "https://www.qoo10.jp/g/1048654649" },
                    { name: "キュリペア メラクリーム", url: "https://www.qoo10.jp/g/917815387" },
                    { name: "キュリペア メルダーSOSシステム", url: "https://www.qoo10.jp/g/979244228" },
                    { name: "キュリペア サンドラッピング", url: "https://www.qoo10.jp/g/1127360604" },
                    { name: "キュリペア シグネチャーアンプル", url: "https://www.qoo10.jp/g/1023479127" }
                ]
            }
        };

        let currentQuestion = "Q1";
        let questionCount = 0;
        let totalQuestions = 0;
        let questionHistory = [];

        function startDiagnosis() {
            questionHistory = [];
            questionCount = 0;
            currentQuestion = "Q1";
            document.getElementById('startScreen').style.display = 'none';
            document.getElementById('questionArea').style.display = 'block';
            showQuestion(currentQuestion);
        }

        function showQuestion(questionId) {
            const question = questions[questionId];
            if (!question) return;

            if (!questionHistory.includes(questionId)) {
                questionCount++;
            }
            updateProgressBar();

            const showBackButton = questionHistory.length > 0 ? 
                `<div class="btn-back">
                    <button class="back-btn" onclick="goBack()">← 前の質問に戻る</button>
                </div>` : '';

            const questionArea = document.getElementById('questionArea');
            questionArea.innerHTML = `
                <div class="question-container">
                    <span class="question-number">質問 ${questionCount}</span>
                    <div class="question">${question.text}</div>
                    <div class="btn-group">
                        <button class="btn btn-yes" onclick="answer('${questionId}', true)">はい</button>
                        <button class="btn btn-no" onclick="answer('${questionId}', false)">いいえ</button>
                    </div>
                    ${showBackButton}
                </div>
            `;
        }

        function answer(questionId, isYes) {
            const question = questions[questionId];
            const nextStep = isYes ? question.yes : question.no;

            // 현재 질문과 답변을 히스토리에 저장
            questionHistory.push({
                questionId: questionId,
                answer: isYes
            });

            if (results[nextStep]) {
                showResult(nextStep);
            } else {
                currentQuestion = nextStep;
                showQuestion(nextStep);
            }
        }

        function goBack() {
            if (questionHistory.length > 0) {
                // 마지막 항목 제거
                questionHistory.pop();
                questionCount--;
                
                if (questionHistory.length === 0) {
                    // 첫 질문으로 돌아가기
                    currentQuestion = "Q1";
                } else {
                    // 이전 질문의 답변에 따라 현재 위치 결정
                    const lastItem = questionHistory[questionHistory.length - 1];
                    const lastQuestion = questions[lastItem.questionId];
                    currentQuestion = lastItem.answer ? lastQuestion.yes : lastQuestion.no;
                }
                
                showQuestion(currentQuestion);
            }
        }

        function showResult(resultType) {
            const result = results[resultType];
            updateProgressBar(100);

            document.getElementById('questionArea').style.display = 'none';
            document.getElementById('resultArea').style.display = 'block';
            
            let productsHTML = '';
            result.products.forEach(product => {
                productsHTML += `
                    <a href="${product.url}" target="_blank" class="product-item">
                        <span class="product-name">${product.name}</span>
                        <span class="product-arrow">→</span>
                    </a>
                `;
            });
            
            const resultArea = document.getElementById('resultArea');
            resultArea.innerHTML = `
                <div class="result-container">
                    <img src="https://dp.image-qoo10.jp/dp2016/JP/GMKT.IMG/front_image/minishop/2024/03/19/e3f368a7-3fa0-43ba-b542-a3f1ae8b686c.s_110-w-fs-st_s.jpg" alt="Logo" class="result-logo">
                    <div class="result-title">あなたの肌タイプは</div>
                    <div class="result-type">${result.type}</div>
                    <div class="result-description">${result.description}</div>
                    <div class="recommend-section">
                        <div class="recommend-title">おすすめ商品</div>
                        <div class="product-list">
                            ${productsHTML}
                        </div>
                    </div>
                    <button class="restart-btn" onclick="restart()">もう一度診断する</button>
                </div>
            `;
        }

        function updateProgressBar(percentage = null) {
            const progressBar = document.getElementById('progressBar');
            const progress = percentage !== null ? percentage : (questionCount / 9) * 100;
            progressBar.style.width = progress + '%';
        }

        function restart() {
            currentQuestion = "Q1";
            questionCount = 0;
            questionHistory = [];
            document.getElementById('resultArea').style.display = 'none';
            document.getElementById('questionArea').style.display = 'none';
            document.getElementById('startScreen').style.display = 'block';
            updateProgressBar(0);
        }
    </script>
</body>
</html>
